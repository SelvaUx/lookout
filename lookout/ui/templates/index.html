<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lookout — your screen-aware assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-2: #1f6feb;
      --good: #2ea043;
      --warn: #d29922;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      height: 100vh;
    }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }
    .stage {
      display: flex; flex-direction: column;
      background: #000;
      position: relative;
    }
    .stage .frame {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      overflow: auto;
      padding: 16px;
    }
    .stage img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.6); }
    .stage .bar {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,.55);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      backdrop-filter: blur(6px);
    }
    .panel {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .panel header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel header h1 { font-size: 16px; margin: 0 0 4px; }
    .panel header .meta { font-size: 12px; color: var(--muted); }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.45;
      font-size: 14px;
      max-width: 100%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      background: var(--accent-2);
      color: #fff;
      align-self: flex-end;
    }
    .msg.assistant {
      background: #0d1117;
      border: 1px solid var(--border);
    }
    .msg.error { background: rgba(248,81,73,.1); border: 1px solid var(--bad); color: #ffb3ad; }
    .input {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex; gap: 8px;
    }
    .input input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .input input:focus { outline: 2px solid var(--accent); }
    .input button {
      background: var(--accent-2);
      color: #fff;
      border: 0;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input button:disabled { opacity: 0.6; cursor: wait; }
    .input .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .refresh {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(0,0,0,.55);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .refresh:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bar" id="bar">idle</div>
    <div class="frame"><img id="frame" alt="screen" /></div>
    <button class="refresh" id="refresh">↻ refresh frame</button>
  </div>
  <div class="panel">
    <header>
      <h1>👀 Lookout</h1>
      <div class="meta" id="meta">loading…</div>
    </header>
    <div class="chat" id="chat"></div>
    <div class="input">
      <div style="flex:1">
        <input id="q" placeholder="Ask about your screen — e.g. 'what's this error?'" />
        <div class="hint">Press Enter to send. Each turn snaps a fresh screenshot.</div>
      </div>
      <button id="send">Ask</button>
    </div>
  </div>
<script>
const frameEl = document.getElementById('frame');
const bar = document.getElementById('bar');
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const meta = document.getElementById('meta');

let lastTs = 0;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function refreshFrame() {
  try {
    const r = await fetch('/api/frame');
    const data = await r.json();
    frameEl.src = data.image;
    lastTs = data.timestamp;
    bar.textContent = new Date(data.timestamp * 1000).toLocaleTimeString();
  } catch (e) {
    bar.textContent = 'capture failed: ' + e;
  }
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg('user', q);
  sendBtn.disabled = true;
  bar.textContent = 'thinking…';
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const data = await r.json();
    if (data.error) {
      addMsg('error', data.error);
    } else {
      frameEl.src = data.image;
      bar.textContent = new Date(data.timestamp * 1000).toLocaleTimeString();
      addMsg('assistant', data.answer);
    }
  } catch (e) {
    addMsg('error', String(e));
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('refresh').addEventListener('click', refreshFrame);

(async () => {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    meta.textContent = `backend: ${s.backend}` + (s.has_cloud ? ' · cloud creds ✓' : ' · no cloud creds');
  } catch (e) { meta.textContent = 'status unavailable'; }
  refreshFrame();
  setInterval(refreshFrame, 5000);
})();
</script>
</body>
</html>
